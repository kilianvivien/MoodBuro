[package]
name = "moodburo"
version.workspace = true
edition.workspace = true
license.workspace = true
[lib]
name = "moodburo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "~2.12.0", features = ["unstable", "macos-private-api"] }
tauri-plugin-opener = "2"
serde.workspace = true
url.workspace = true
uuid.workspace = true
md-moodle = { path = "../crates/md-moodle" }
md-secrets = { path = "../crates/md-secrets" }
md-store = { path = "../crates/md-store" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

objc2-foundation = { version = "0.3", features = ["NSLocale", "NSArray", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSResponder", "NSView"] }
