[package]
name = "moodburo"
version.workspace = true
edition.workspace = true
license.workspace = true
[lib]
name = "moodburo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "~2.12.0", features = ["unstable", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-notification = "=2.8.0"
tauri-plugin-global-shortcut = "=2.4.1"
tokio = { version = "1", features = ["time", "sync", "macros"] }
md-os = { path = "../crates/md-os" }
md-notifier = { path = "../crates/md-notifier" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde.workspace = true
url.workspace = true
uuid.workspace = true
md-moodle = { path = "../crates/md-moodle" }
md-secrets = { path = "../crates/md-secrets" }
md-assistant = { path = "../crates/md-assistant" }
serde_json.workspace = true
md-store = { path = "../crates/md-store" }
md-inspcal = { path = "../crates/md-inspcal" }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKDownload", "WKWebView", "WKNavigation", "WKUIDelegate", "WKBackForwardList", "WKBackForwardListItem", "WKNavigationDelegate", "WKNavigationAction", "WKNavigationResponse", "WKFrameInfo", "block2"] }

objc2-foundation = { version = "0.3", features = ["NSProgress", "NSLocale", "NSArray", "NSString", "NSData", "NSURL", "NSURLRequest", "NSURLResponse"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSView", "NSGraphics", "NSWindow", "NSToolbar", "NSToolbarItem", "NSImage", "NSAlert", "NSWorkspace", "NSRunningApplication", "block2", "NSTextField", "NSScrollView"] }
objc2-quick-look-ui = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "QLPreviewView", "QLPreviewItem"] }
objc2-pdf-kit = { version = "0.3", default-features = false, features = ["PDFView", "PDFDocument", "PDFPage", "objc2-app-kit", "objc2-core-foundation"] }
