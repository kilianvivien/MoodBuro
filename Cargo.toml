[workspace]
members = ["src-tauri", "crates/*"]
# The vendored InspCal engine is a path dependency of md-inspcal, not a member:
# its own binaries and WebAssembly settings are never MoodBuro targets.
exclude = ["vendor/inspcal/engine"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
rust-version = "1.91"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = { version = "2", features = ["serde"] }
zeroize = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Rust 1.91's debug stripping can misalign host proc-macro dylibs on macOS 27.
# Keep build-time plugins unstripped so dyld can load them during release builds.
[profile.release.build-override]
strip = "none"
