name: Package macOS
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to publish; leave empty for installer-only packaging'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: macos-release
  cancel-in-progress: false
jobs:
  universal-dmg:
    runs-on: macos-26
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/test-release.py
      - name: Validate release configuration
        if: env.RELEASE_TAG != ''
        env:
          PUBLIC_KEY: ${{ vars.MOODBURO_UPDATE_PUBLIC_KEY }}
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PUBLIC_KEY" && test -n "$PRIVATE_KEY"
          python3 scripts/release.py "$RELEASE_TAG"
          test "$(gh repo view --json visibility --jq .visibility)" = PUBLIC
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; choose a new version.' >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then
            if gh release view beta-feed >/dev/null 2>&1; then
              gh release download beta-feed --pattern beta.json --dir "$RUNNER_TEMP/previous-beta"
              python3 scripts/release.py "$RELEASE_TAG" --previous "$RUNNER_TEMP/previous-beta/beta.json"
            fi
          else
            # GitHub /latest excludes prereleases. Older stable releases need not have a manifest.
            gh api repos/kilianvivien/MoodBuro/releases/latest --jq '{version: .tag_name}' > "$RUNNER_TEMP/previous-stable.json"
            python3 scripts/release.py "$RELEASE_TAG" --previous "$RUNNER_TEMP/previous-stable.json"
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm format:check && pnpm test
      - run: cargo fmt --all --check && cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python3 scripts/check-security.py
      - name: Build universal installer and signed update
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MOODBURO_UPDATE_PUBLIC_KEY: ${{ env.RELEASE_TAG != '' && vars.MOODBURO_UPDATE_PUBLIC_KEY || '' }}
        shell: bash
        run: |
          extra=()
          if [[ -n "$RELEASE_TAG" ]]; then
            python3 -c 'import json, os; json.dump({"bundle":{"createUpdaterArtifacts":True},"plugins":{"updater":{"pubkey":os.environ["MOODBURO_UPDATE_PUBLIC_KEY"]}}},open(os.environ["RUNNER_TEMP"]+"/updater.json","w"))'
            extra=(--config "$RUNNER_TEMP/updater.json")
          fi
          pnpm tauri build --ci --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.alpha.conf.json "${extra[@]}"
      - name: Verify and collect installer
        shell: bash
        run: |
          set -euo pipefail
          bundle=target/universal-apple-darwin/release/bundle
          codesign --verify --deep --strict "$bundle/macos/MoodBuro.app"
          archs=$(lipo -archs "$bundle/macos/MoodBuro.app/Contents/MacOS/moodburo")
          [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]]
          mkdir -p artifacts
          cp "$bundle"/dmg/*.dmg artifacts/
          for installer in artifacts/*.dmg; do hdiutil verify "$installer"; done
          cd artifacts
          shasum -a 256 ./*.dmg > SHA256SUMS.txt
      - name: Collect release artifacts
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ".github/release-notes/$RELEASE_TAG.md" ]]; then
            cp ".github/release-notes/$RELEASE_TAG.md" "$RUNNER_TEMP/release-notes.txt"
          else
            gh api repos/kilianvivien/MoodBuro/releases/generate-notes -f tag_name="$RELEASE_TAG" --jq .body > "$RUNNER_TEMP/release-notes.txt"
          fi
          python3 scripts/release.py "$RELEASE_TAG" --bundle target/universal-apple-darwin/release/bundle --notes "$RUNNER_TEMP/release-notes.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: MoodBuro-macos-universal
          path: artifacts/
          if-no-files-found: error
      - name: Publish release
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --draft --title "MoodBuro ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/release-notes.txt"
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
            if ! gh release view beta-feed >/dev/null 2>&1; then
              gh release create beta-feed --target "$(git rev-parse HEAD)" --prerelease --latest=false --title 'Beta update feed' --notes 'Signed beta update manifest. Install a versioned beta DMG for first use.'
            fi
            gh release upload beta-feed artifacts/beta.json --clobber
          else
            # latest.json is already attached before this becomes the normal latest release.
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
